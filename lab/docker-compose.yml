services:
  php2shell-lab:
    build: .
    container_name: php2shell-lab
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./www:/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/index.php"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
